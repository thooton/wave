name: Public website
on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'spec/setup-*.json'
      - 'spec/setup-*.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'spec/setup-*.json'
      - 'spec/setup-*.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and stage public files
        run: |
          node --test site/tests/*.test.mjs site/src/protocols/tests/*.test.mjs
          python3 site/scripts/build.py "$RUNNER_TEMP/pages"
          python3 site/scripts/check_pages.py "$RUNNER_TEMP/pages"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: public-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish to Pages
        id: pages
        uses: actions/deploy-pages@v4
