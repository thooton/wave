name: Build

on:
  push:
    branches-ignore: ['emulator/**']
  pull_request:
  workflow_dispatch:
    inputs:
      retry-publish:
        description: Republish the manifest using the original versioned APK if its release exists
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_BUILD_TOOLS: 35.0.1

jobs:
  app:
    name: Wave app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test QA tools
        run: python3 -m unittest discover -s tools/qa

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Self-test and build with the checked-in debug key
        run: |
          ./gradlew --no-daemon :app:core:selfTest :app:app:selfTest :app:app:assembleRelease
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --min-sdk-version 27 app/app/build/outputs/apk/release/app-release.apk

      - name: Name the APK
        run: cp app/app/build/outputs/apk/release/app-release.apk wave.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wave-apk
          path: wave.apk
          if-no-files-found: error

  # The website: the rooting page at the site root and recovery/. It serves the
  # Wave APK just built, the official Magisk 24.0 and the Sonim programmer, so
  # the user chooses no files. Deployed to GitHub Pages from master.
  site:
    name: Website
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: wave-apk

      - name: Test the site
        run: node --test site/tests/*.test.mjs site/src/protocols/tests/*.test.mjs

      - name: Fetch Magisk 24.0
        run: curl -fsSL --retry 3 -o Magisk-v24.0.apk https://github.com/topjohnwu/Magisk/releases/download/v24.0/Magisk-v24.0.apk

      - name: Stage the site
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/app/build.gradle)
          python3 site/scripts/build.py "$RUNNER_TEMP/pages" --magisk-apk Magisk-v24.0.apk --wave-apk wave.apk --wave-version "$version"
          python3 site/scripts/check_pages.py "$RUNNER_TEMP/pages"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: ${{ runner.temp }}/pages

  deploy-site:
    name: Deploy the website
    needs: site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: public-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish to Pages
        id: pages
        uses: actions/deploy-pages@v4
  publish-wave:
    name: Publish Wave release
    needs: app
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: wave-apk

      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Prepare immutable Wave release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_PUBLISH: ${{ inputs.retry-publish }}
        run: |
          export AAPT2="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2"
          options=()
          if [[ "$RETRY_PUBLISH" == true ]]; then options+=(--retry-publish); fi
          python3 tools/wavesrc/release_wave.py wave.apk "${options[@]}"

      - uses: ./publish
        if: steps.release.outputs.binary != '' && vars.WAVE_PUBLISH_ENABLED == 'true'
        with:
          source-repository: thooton/wave_repository
          source-token: ${{ secrets.WAVE_REPOSITORY_TOKEN }}
          section: tools
          folder: wave
          meta: app/wave/package.json
          icon: app/wave/icon.png
          binary: ${{ steps.release.outputs.binary }}
          url: ${{ steps.release.outputs.url }}
          changes-path: app
