name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_BUILD_TOOLS: 35.0.1

jobs:
  app:
    name: Wave app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - uses: gradle/actions/setup-gradle@v4

      # :core's plain-Java self-tests (git client, scripts and parsers, ...)
      # and the release APK, signed with the shared key in signing/.
      - name: Self-test and build
        run: ./gradlew --no-daemon :app:core:selfTest :app:app:assembleRelease

      - name: Name the APK
        run: cp app/app/build/outputs/apk/release/app-release.apk wave.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wave-apk
          path: wave.apk
          if-no-files-found: error
