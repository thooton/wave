name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      retry-publish:
        description: Republish the manifest using the original versioned APK if its release exists
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_BUILD_TOOLS: 35.0.1

jobs:
  app:
    name: Wave app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - uses: gradle/actions/setup-gradle@v4

      # :core's plain-Java self-tests (git client, scripts and parsers, ...)
      # and the release APK. It is signed with the release key from the
      # repository secrets. A pull request or fork has none and falls back to
      # the PUBLIC debug key in signing/, which the release gate refuses to
      # publish; a push to master is published, so it must have the key.
      - name: Self-test and build
        env:
          WAVE_KEYSTORE_BASE64: ${{ secrets.WAVE_KEYSTORE_BASE64 }}
          WAVE_KEYSTORE_PASSWORD: ${{ secrets.WAVE_KEYSTORE_PASSWORD }}
          WAVE_KEY_ALIAS: ${{ secrets.WAVE_KEY_ALIAS }}
          WAVE_KEY_PASSWORD: ${{ secrets.WAVE_KEY_PASSWORD }}
          WAVE_REQUIRE_RELEASE_KEY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && '1' || '' }}
        run: |
          python3 -m unittest discover -s signing -p 'test_check_signer.py'
          ./gradlew --no-daemon :app:core:selfTest :app:app:selfTest :app:app:assembleRelease

      - name: Name the APK
        run: cp app/app/build/outputs/apk/release/app-release.apk wave.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wave-apk
          path: wave.apk
          if-no-files-found: error

  # The website: the rooting page at the site root and recovery/. It serves the
  # Wave APK just built, the official Magisk 24.0 and the Sonim programmer, so
  # the user chooses no files. Deployed to GitHub Pages from master.
  site:
    name: Website
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: wave-apk

      - name: Test the site
        run: node --test site/tests/*.test.mjs site/src/protocols/tests/*.test.mjs

      # The programmer is not in the repository. Set the repository variable
      # SONIM_PROGRAMMER_URL to where CI can download it; build.py refuses any
      # file but the pinned one. Without it the page asks the user for the file.
      - name: Fetch Magisk 24.0 and the Sonim programmer
        env:
          SONIM_PROGRAMMER_URL: ${{ vars.SONIM_PROGRAMMER_URL }}
        run: |
          curl -fsSL --retry 3 -o Magisk-v24.0.apk https://github.com/topjohnwu/Magisk/releases/download/v24.0/Magisk-v24.0.apk
          if [[ -n "$SONIM_PROGRAMMER_URL" ]]; then
            curl -fsSL --retry 3 -o prog_emmc_firehose_8909_ddr.mbn "$SONIM_PROGRAMMER_URL"
          else
            echo '::warning::SONIM_PROGRAMMER_URL is not set: the site will ask users for the programmer file.'
          fi

      - name: Stage the site
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/app/build.gradle)
          options=(--magisk-apk Magisk-v24.0.apk --wave-apk wave.apk --wave-version "$version")
          if [[ -f prog_emmc_firehose_8909_ddr.mbn ]]; then options+=(--programmer prog_emmc_firehose_8909_ddr.mbn); fi
          python3 site/scripts/build.py "$RUNNER_TEMP/pages" "${options[@]}"
          python3 site/scripts/check_pages.py "$RUNNER_TEMP/pages"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: ${{ runner.temp }}/pages

  deploy-site:
    name: Deploy the website
    needs: site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: public-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish to Pages
        id: pages
        uses: actions/deploy-pages@v4
  publish-wave:
    name: Publish Wave to the default source
    needs: app
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.WAVE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: wave-apk

      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Prepare immutable Wave release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_PUBLISH: ${{ inputs.retry-publish }}
          SOURCE_TOKEN: ${{ secrets.WAVE_REPOSITORY_TOKEN }}
        run: |
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo 'WAVE_REPOSITORY_TOKEN: required when WAVE_PUBLISH_ENABLED is true' >&2
            exit 1
          fi
          export AAPT2="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2"
          options=()
          if [[ "$RETRY_PUBLISH" == true ]]; then options+=(--retry-publish); fi
          python3 tools/wavesrc/release_wave.py wave.apk "${options[@]}"

      - uses: ./publish
        if: steps.release.outputs.binary != ''
        with:
          source-repository: thooton/wave_repository
          source-token: ${{ secrets.WAVE_REPOSITORY_TOKEN }}
          section: applications
          folder: wave
          meta: app/wave/package.json
          icon: app/wave/icon.png
          binary: ${{ steps.release.outputs.binary }}
          url: ${{ steps.release.outputs.url }}
          changes-path: app
