plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/app.gradle")

// The shared signing key is also what lets it hand APKs to Installer, whose
// install permission is signature-only (until root replaces that path).

android {
    namespace "com.wave.xp3"

    defaultConfig {
        applicationId "com.wave.xp3"
        versionCode 51
        versionName "0.7.44"
    }
}

// Host tests: the decisions behind the screens (what a row says, which menu entries a
// package offers, how a snapshot is projected) run on a desktop JVM with the same
// plain runner and Check as :app:core, no emulator and no test framework. Android's
// classes are the stubs of android.jar, so anything that needs a real View is kept
// out of what these tests touch (see Format, Actions and Pages).
android.testOptions.unitTests.returnDefaultValues = true

// The plain JVM runner below uses the debug variant; there is no separate release suite.
androidComponents {
    beforeVariants(selector().withBuildType("release")) { builder ->
        builder.enableUnitTest = false
    }
}

dependencies {
    testImplementation testFixtures(project(":common:core"))
    implementation project(":app:core")
    implementation project(":common:ui")
}

// ./gradlew :app:app:selfTest
afterEvaluate {
    def unit = tasks.named("testDebugUnitTest")
    unit.configure { enabled = false } // the runner below replaces framework discovery
    tasks.register("selfTest", JavaExec) {
        dependsOn unit
        classpath = files({ unit.get().classpath })
        mainClass = "com.wave.xp3.app.AppSelfTest"
    }
    tasks.named("check") { dependsOn "selfTest" }
}
